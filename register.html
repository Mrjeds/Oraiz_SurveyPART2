<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		username
		<input id='user' type='text'>
		password
		<input id='pass' type='password'>
		verify password
		<input id='verifyPass' type='password'>

		<button type="button" onclick="clickButton( document.getElementById('user').value ,document.getElementById('pass').value, document.getElementById('verifyPass').value )">Register</button>
		already have account
		<button type="button" onclick="document.location.href = 'login.html'">login</button>
		<script>




		const clickButton = (a,b, c) =>{

			if (b !== c) {
				alert('passwords do not match');
				return;
			}

			const postData = {
				name:a,
				password:b
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/users',data);
					const body = await response.json();
					console.log(response)
					if (body.message) {
						document.location.href = 'login.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
