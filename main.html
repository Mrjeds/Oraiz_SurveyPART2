<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		Book title
		<input id='Name' type='text'>
		Price
		<input id='Price' type='text'>
		Note
		<input id='Note' type='text'>

		<button type="button" onclick="clickButton( document.getElementById('Name').value ,document.getElementById('Price').value, document.getElementById('Note').value )">Save Book</button>
		<script>




		const clickButton = (a,b,c) =>{

			const postData = {
				Name:a,
				Price:b,
				Note:c
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/books',data);
					const body = await response.json();
					console.log(response)
					if (body.message) {
						alert('Book saved!');
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
